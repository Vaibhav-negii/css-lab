# Render blueprint — one file, one click.
# Push this repository to GitHub, then in Render choose
#   New +  →  Blueprint  →  pick the repo  →  Apply.
services:
  - type: web
    name: css-lab
    runtime: node
    plan: free
    region: singapore          # closest free region to India
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
